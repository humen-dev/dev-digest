# Agent evals pipeline — thin caller of the reusable eval engine (evals.yml) with suite: agents.
# Runs when a subagent in .claude/agents/ or its eval in evals/agents/ changes.
# Selection (which agents suites run) is done by evals/src/ci/select-cli.ts from the PR diff;
# a change with no matching eval prints SKIP. Model jobs are non-blocking (see evals.yml).
name: eval-agents

on:
  pull_request:
    paths:
      - '.claude/agents/**'
      - 'evals/agents/**'
      - 'evals/src/**'
      - 'evals/package.json'
      - 'evals/pnpm-lock.yaml'
      - 'evals/*.config.*'
      - 'evals/tsconfig*.json'
      - 'evals/proxy/**'
      - '.github/workflows/evals.yml'
      - '.github/actions/evals-setup/**'
      - '.github/workflows/eval-agents.yml'

permissions:
  contents: read

concurrency:
  group: eval-agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    uses: ./.github/workflows/evals.yml
    with:
      suite: agents
      scope: auto
    secrets: inherit
